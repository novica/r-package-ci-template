name: R CMD Check

on:
  # Keeps the README badge on the status of main.
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "codecov.yml"
      - "_pkgdown.yml"
      - "pkgdown/**"
      - "CITATION.cff"
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  air:
    name: air format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Check
        run: air format . --check

  jarl:
    name: jarl check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `jarl check` by default.
      - uses: etiennebacher/setup-jarl@v0.1.1

  R-CMD-check:
    needs: [air, jarl]
    if: github.repository != 'novica/r-package-ci-template' # template-only
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.no-suggests && ', no Suggests' || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: "release" }
          # quarto can't load the package while R CMD build renders vignettes
          # on Windows, so vignettes are neither built nor checked there. The
          # other platforms check them.
          - { os: windows-latest, r: "release", skip-vignettes: true }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          # CRAN sometimes checks without Suggests installed, so examples and
          # tests that use a Suggests package must be guarded. Vignettes
          # need their engine from Suggests and are skipped here.
          - { os: ubuntu-latest, r: "release", no-suggests: true, skip-vignettes: true }
        # R-devel has no binary packages, so that job compiles every
        # dependency. Run it and the no-Suggests check weekly and on demand,
        # not on PRs or pushes.
        exclude: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && fromJSON('[{"config":{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"}},{"config":{"os":"ubuntu-latest","r":"release","no-suggests":true,"skip-vignettes":true}}]') || fromJSON('[]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.no-suggests && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # extra-repositories: https://example.org/R  # e.g. for non-CRAN Suggests

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.no-suggests && '"hard"' || '"all"' }}
          # The tests still need testthat without the other Suggests.
          extra-packages: any::rcmdcheck${{ matrix.config.no-suggests && ' any::testthat' || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          upload-snapshots: true
          build_args: ${{ matrix.config.skip-vignettes && 'c("--no-manual", "--no-build-vignettes")' || '"--no-manual"' }}
          args: ${{ matrix.config.skip-vignettes && 'c("--no-manual", "--as-cran", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}
